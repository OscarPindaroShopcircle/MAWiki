services:
  db:
    image: postgres:18
    restart: "no"
    env_file:
      - ${HARNESS_ENV_FILE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-backend_test}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MIGRATOR_DB_USER: ${MIGRATOR__USER:-migrator_user}
      MIGRATOR_DB_PASSWORD: ${MIGRATOR__PASSWORD:-migrator_password}
      APP_DB_USER: ${DATABASE__USER:-app_user}
      APP_DB_PASSWORD: ${DATABASE__PASSWORD:-app_password}
      OPENWEBUI_DB_USER: ${OPENWEBUI__USER:-openwebui_user}
      OPENWEBUI_DB_PASSWORD: ${OPENWEBUI__PASSWORD:-openwebui_password}
      OPENWEBUI_DB: ${OPENWEBUI__DB:-openwebui}
    ports:
      - "${HARNESS_DB_PORT}:5432"
    volumes:
      - ../../../deploy/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:z
      - ../../../deploy/init_db.sql:/opt/init_db.sql:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-backend_test}"]
      interval: 3s
      timeout: 3s
      retries: 10
