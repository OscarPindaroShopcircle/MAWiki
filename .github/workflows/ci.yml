name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]


permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run pytest tests/unit

  integration-tests:
    runs-on: ubuntu-latest
    env:
      ENV_FILE: .env.test
      YAML_CONFIG_FILE: config.test.yaml
      HARNESS_DB_PORT: 5432
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - name: Start test database
        run: |
          cp .env.test.example .env.test
          docker compose -f src/harness/test/compose.test.yml up --detach --wait
          uv run alembic upgrade head
      - run: uv run pytest -m integration
      - name: Show database logs
        if: failure()
        run: docker compose -f src/harness/test/compose.test.yml logs
      - name: Stop test database
        if: always()
        run: docker compose -f src/harness/test/compose.test.yml down --volumes --remove-orphans
