name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run pre-commit run --all-files

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - run: uv run pytest -m unit

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --extra cpu
      - name: Start test database
        run: |
          cp .env.test.example .env.test
          HARNESS_PORT=5432 docker compose -f src/harness/test/compose.test.yml up --detach --wait
          HARNESS_DB_URL=postgresql://migrator_user:migrator_password@localhost:5432/backend_test uv run alembic upgrade head
      - run: uv run pytest -m integration
      - name: Show database logs
        if: failure()
        run: docker compose -f src/harness/test/compose.test.yml logs
      - name: Stop test database
        if: always()
        run: docker compose -f src/harness/test/compose.test.yml down --volumes --remove-orphans
