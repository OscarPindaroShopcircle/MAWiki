[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "uv run --no-sync alembic upgrade head"
startCommand = "sh -c \"exec uv run --no-sync uvicorn src.backend.server:create_app --factory --host 0.0.0.0 --port ${PORT:-8000} --proxy-headers --forwarded-allow-ips='*'\""
healthcheckPath = "/ping"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
sleepApplication = false
multiRegionConfig = { "europe-west4-drams3a" = { numReplicas = 1 } }
