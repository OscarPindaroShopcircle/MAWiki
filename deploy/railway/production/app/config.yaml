app_name: Menelao
env: production

database:
  user: app_user
  password:
    env_var: DATABASE__PASSWORD
  host: localhost
  port: 5432
  db: railway

migrator:
  user: migrator_user
  password:
    env_var: MIGRATOR__PASSWORD
  host: localhost
  port: 5432
  db: railway

auth:
  jwt_secret:
    google:
      client_id: "725515531820-g9jf7cinvj434pa68mq5hu7n2lo533ld.apps.googleusercontent.com"
      client_secret: {env_var: "GOOGLE_CLIENT_SECRET"}
    env_var: AUTH_JWT_SECRET
  cookie_secure: true

mcp:
  enabled: true
  auth_enabled: true
  public_url: "https://mawiki-production.up.railway.app/"
  redirect_path: "https://mawiki-production.up.railway.app/auth/mcp/callback"
  google:
    client_id: "725515531820-2vg6tanqr9trl68c0i7ato2cd9fmqhbv.apps.googleusercontent.com"
    client_secret: {env_var: "MCP_GOOGLE_CLIENT_SECRET"}
    workspace_domain: "shopcircle.co"
  jwt_signing_key: {env_var: "MCP_JWT_SIGNING_KEY"}

frontend:
  enabled: true
  components_dir: src/frontend/components
  static_dir: src/frontend/static

storage:
  storage_root: /data/uploads

cors_origins: []
cors_allow_credentials: true
