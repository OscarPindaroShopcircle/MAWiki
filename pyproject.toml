[project]
name = "backend"
version = "0.1.0"
description = "A repo where I try fronted + backend integration"
authors = [
    { name = "Oscar Pindaro", email = "oscar@shopcircle.co" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "uuid-utils>=0.16.0",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "jinjax>=0.65",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "fastapi-sso>=0.21.1",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv_build]
packages = [
  { include = "backend", from = "src" },
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
]


[tool.ruff.lint]
select = ["E402", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests - no external dependencies",
    "integration: Integration tests - requires database",
    "e2e: End-to-end tests - full application stack",
]
