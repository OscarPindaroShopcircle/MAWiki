[project]
name = "menelao"
version = "0.1.0"
description = "Menelao is a mcp + fe + be for managing knowledge bases"
authors = [
    { name = "Oscar Pindaro", email = "oscar@shopcircle.co" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic[email]>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "uuid-utils>=0.16.0",
    "uvicorn[standard]>=0.47.0",
    "jinja2>=3.1.6",
    "jinjax>=0.65",
    "passlib[bcrypt]>=1.7.4",
    "pyjwt>=2.13.0",
    "fastapi-sso>=0.21.1",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "python-dotenv>=1.1.1",
    "haystack-ai>=3.0.0",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.1",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.7.0",
    "model2vec>=0.9.0",
    "nltk>=3.10.3",
    "mcp>=1.29.0",
    "fastmcp>=3.4.7",
    "markdown-it-py>=4.2.0",
    "sentence-transformers-haystack>=0.1.1",
    "accelerate>=1.14.0",
    "rich>=13.0.0",
    "typer>=0.15.0",
    "platformdirs==4.9.4",
    "faiss-haystack==2.0.0",
    "trafilatura==2.1.0",
    "python-pptx==1.0.2",
    "pandas==3.0.5",
]

[project.scripts]
menelao = "cli.app:app"

[project.optional-dependencies]
cpu = [
    "torch",
    "torchvision",
]
gpu = [
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-gpu", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-gpu"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[tool.uv_build]
packages = [
  { include = "backend", from = "src" },
]

[tool.uv.build-backend]
module-name = "backend"

[tool.ruff.lint]
select = ["E402", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests - no external dependencies",
    "integration: Integration tests - requires database",
    "e2e: End-to-end tests - full application stack",
]


[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"
